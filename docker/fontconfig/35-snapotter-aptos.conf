<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Aptos is Office's default font since 2024 and has no free metric clone.
  Without this alias fontconfig falls back to DejaVu Sans, which is much wider,
  so converted documents reflow. Carlito is the closest free sans in the image;
  Aptos runs slightly wider, so text comes out a little narrower instead (#4879).
  Never bundle Aptos itself: it isn't freely licensed.
-->
<fontconfig>
  <alias binding="same">
    <family>Aptos</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos Display</family>
    <accept><family>Carlito</family></accept>
  </alias>
</fontconfig>
