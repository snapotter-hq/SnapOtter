name: Deploy Landing to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      # What the site captures lives in shared; a change there must go live too.
      - "packages/shared/src/analytics/public-site.ts"
  # Daily rebuild so the build-time GitHub stars / Docker Hub pull-count fetches
  # refresh even when no landing files changed.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup

      - name: Build Landing Page
        run: pnpm --filter @snapotter/landing build
        env:
          # Authenticated GitHub API (5,000 req/hr) so the build-time star-count
          # fetch isn't rate-limited on shared runner IPs (60 req/hr unauth).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Full PostHog SDK through the first-party proxy (e.snapotter.com) so
          # ad blockers don't drop it; same phc_ project key the app image bakes
          # and the docs deploy uses. In forks and PRs the secret is empty and
          # Analytics.astro emits nothing.
          PUBLIC_POSTHOG_KEY: ${{ secrets.SNAPOTTER_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: https://e.snapotter.com

      # Astro's getRelativeLocaleUrl lowercases locale segments by default, so a
      # regression could re-emit /zh-cn/ etc. in hrefs and hreflang. Those 404 on
      # case-sensitive Cloudflare Pages while the built dirs + sitemap keep canonical
      # mixed case, and the mismatch is invisible on a case-insensitive dev machine.
      # Fail the deploy if any lowercased variant of a mixed-case locale directory
      # leaks into the emitted HTML. See #554.
      - name: Guard against lowercased locale URLs
        run: |
          set -uo pipefail
          dist=apps/landing/dist
          fail=0
          for dir in "$dist"/*/; do
            name=$(basename "$dir")
            lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            [ "$name" = "$lower" ] && continue
            hits=$(grep -rIl --include='*.html' "/$lower/" "$dist" || true)
            if [ -n "$hits" ]; then
              echo "::error::Lowercased locale path /$lower/ found in built HTML (canonical is /$name/); it would 404 on Cloudflare Pages. See #554."
              printf '%s\n' "$hits" | head -5
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Deploy blocked: lowercased locale URLs would 404 on case-sensitive hosting."
            exit 1
          fi
          echo "Locale URL casing OK: no lowercased locale paths in built output."

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/landing/dist --project-name snapotter-landing --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare can add scripts at the zone edge that never appear in the
      # built output: its Web Analytics beacon rode every page this way (#793).
      # Web Analytics is the one edge feature we keep, so it is allowlisted.
      # Audit the page a visitor receives and fail the run if it loads anything
      # else from an origin we did not choose. PostHog loads at runtime from
      # inline script, so it never shows up as a tag here.
      - name: Verify the live site loads nothing third-party
        run: node scripts/check-live-egress.mjs https://snapotter.com/ --allow https://static.cloudflareinsights.com

      # The build emits PostHog only when PUBLIC_POSTHOG_KEY reaches it, and
      # that gate once failed silently for months (the secret was missing from
      # the build env, every page shipped without analytics, nothing went red).
      # So look at the page visitors get. Pages propagation can lag the deploy
      # by a few seconds, hence the retries.
      - name: Verify the live site carries the PostHog snippet
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -H 'Accept: text/html' https://snapotter.com/ | grep -q 'posthog.init("phc_'; then
              echo "PostHog snippet is live"
              exit 0
            fi
            echo "attempt $attempt: snippet not visible yet, waiting for Pages to propagate"
            sleep 20
          done
          echo "::error::The deployed page has no posthog.init call. PUBLIC_POSTHOG_KEY was probably missing at build time."
          exit 1
