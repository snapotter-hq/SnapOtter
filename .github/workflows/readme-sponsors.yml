name: README Sponsors

# Keeps the README's <!-- sponsors --> block in step with GitHub Sponsors (#1076).
# GITHUB_TOKEN cannot read sponsorship data, so the query runs on SPONSORS_TOKEN,
# a classic PAT with read:user only. main is branch-protected, so a change goes
# out as a PR on a fixed branch that later runs force-update. See
# scripts/update-readme-sponsors.mjs for who gets listed.

on:
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC, off the hour so it isn't dropped under load
  workflow_dispatch:

concurrency:
  group: readme-sponsors
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update sponsors block
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/readme-sponsors
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rewrite sponsors block
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node scripts/update-readme-sponsors.mjs

      - name: Open, update, or close PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if git diff --quiet README.md; then
            echo "No sponsor changes."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment "main already matches GitHub Sponsors."
            fi
            exit 0
          fi
          git switch -c "$BRANCH"
          git add README.md
          git -c user.name="SnapOtter" -c user.email="snapotter.hq@gmail.com" \
            commit -q -m "docs(readme): update sponsors list"
          # Skip the force-push when the open PR already carries this exact README.
          if git fetch -q origin "$BRANCH" 2>/dev/null \
            && [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "FETCH_HEAD^{tree}")" ]; then
            echo "PR branch already up to date."
          else
            git push -q --force origin "$BRANCH"
          fi
          if [ -z "$open_pr" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "docs(readme): update sponsors list" \
              --body "Generated by the README Sponsors workflow from GitHub Sponsors. Lists every public sponsor, past and current, in the order they first sponsored. Private sponsors are left out. Check the diff for anyone removed: the list should only grow. A PR opened by GITHUB_TOKEN triggers no checks, so this needs an admin merge."
          fi
