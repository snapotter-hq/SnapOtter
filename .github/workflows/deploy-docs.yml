name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
  # Daily rebuild so the build-time GitHub star count refreshes even when no
  # docs files changed (mirrors deploy-landing.yml, offset an hour so the two
  # scheduled deploys don't fire at once).
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup

      - name: Build Docs
        run: pnpm --filter @snapotter/docs docs:build
        env:
          # Authenticated GitHub API (5,000 req/hr) so the build-time star-count
          # fetch isn't rate-limited on shared runner IPs (60 req/hr unauth).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/docs/.vitepress/dist --project-name snapotter-docs --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The docs share the snapotter.com zone, so anything Cloudflare injects
      # at the edge for the zone lands here too (#793). Web Analytics is kept
      # on purpose and allowlisted; anything else fails the run.
      - name: Verify the live site loads nothing third-party
        run: node scripts/check-live-egress.mjs https://docs.snapotter.com/ --allow https://static.cloudflareinsights.com
