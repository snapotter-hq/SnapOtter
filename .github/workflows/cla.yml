name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  cla:
    # Comments are matched loosely on purpose: contains() ignores case, so
    # "Recheck", "recheck\r\n", or the sign phrase with a trailing period or
    # a greeting in front all get through. The action does the real check.
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, 'recheck') ||
        contains(github.event.comment.body, 'hereby sign the CLA')))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # The action writes signatures/cla.json to the cla-signatures branch;
      # read-only contents made it fail with "Resource not accessible".
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/snapotter-hq/snapotter/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "snapotter-hq,dependabot[bot],renovate[bot],github-actions[bot],snapotter-bot"
          custom-notsigned-prcomment: |
            Thanks for the PR! Before we can merge it, we need you to sign our [Contributor License Agreement](https://github.com/snapotter-hq/snapotter/blob/main/CLA.md). You keep ownership of your code and grant SnapOtter a license to use it, including under our commercial license ([plain-language summary](https://github.com/snapotter-hq/snapotter/blob/main/CLA.md#plain-language-summary)).

            To sign, reply to this PR with:

            > I have read the CLA Document and I hereby sign the CLA

            Case and a trailing period don't matter. You only sign once, and it covers future PRs too.
          # No custom-pr-sign-comment: with it set the action demands an exact,
          # whole-comment match. Its built-in pattern accepts the same phrase with
          # any case, extra spaces, and text around it on the same line.
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
          lock-pullrequest-aftermerge: false
          use-dco-flag: false
