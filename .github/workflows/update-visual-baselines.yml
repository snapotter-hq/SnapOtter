name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          changed rewrites only baselines that fail their comparison. all
          rewrites every baseline whose bytes differ from what renders now,
          including differences under the maxDiffPixelRatio budget, plus a
          few files of render noise per run (#1705).
        type: choice
        options:
          - changed
          - all
        default: changed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baselines:
    # One leg per supported OS so the regenerated *-linux.png and
    # *-darwin.png baselines ship in the same workflow dispatch instead of
    # only the linux ones. Without this, any copy change in a visual test
    # (chromium-visual, mobile-chromium, tablet-chromium) desyncs the darwin
    # baselines until someone with a Mac runs the regenerate command by hand
    # (issue #2042).
    name: Regenerate ${{ matrix.os-label }} visual baselines
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: linux
          - os: macos-latest
            os-label: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # OS_LABEL is read by scripts/visual-baselines-pr.sh to name the
      # regenerated-baselines commit/PR.
      OS_LABEL: ${{ matrix.os-label }}
      # One name per (run, attempt, os) so the two legs never collide on
      # the artifact or on the branch.
      ARTIFACT_NAME: visual-baselines-${{ matrix.os-label }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Read by the regenerate step and named in the PR body, from one place.
      UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots || 'changed' }}
    # The e2e webServer (playwright.config.ts) creates an isolated database via
    # tests/e2e-pg-create-db.cjs, so it needs Postgres + Redis on localhost.
    # Service containers only run on Linux runners, so the image expressions
    # evaluate to empty strings on macos-latest and the macOS leg starts
    # Postgres and Redis via Homebrew below.
    services:
      postgres:
        image: ${{ matrix.os-label == 'linux' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: snapotter
          POSTGRES_PASSWORD: snapotter
          POSTGRES_DB: snapotter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapotter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: ${{ matrix.os-label == 'linux' && 'redis:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Start Postgres and Redis on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install postgresql@17 redis
          PG_BIN="$(brew --prefix postgresql@17)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          export PATH="$PG_BIN:$PATH"
          brew services start postgresql@17
          brew services start redis
          for _ in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          pg_isready -h localhost
          for _ in $(seq 1 30); do redis-cli -h localhost ping && break; sleep 1; done
          redis-cli -h localhost ping
          psql -h localhost postgres -c "CREATE ROLE snapotter WITH LOGIN SUPERUSER PASSWORD 'snapotter';"
          createdb -h localhost -O snapotter snapotter
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-install
      # Only projects and spec files that write @visual baselines run here. The
      # webkit device projects grep-invert @visual (playwright.config.ts), and
      # the other DEVICE_SPECS files (device-mobile, device-tablet, device-a11y)
      # are functional/a11y tests that write no baselines; nightly runs them.
      - name: Regenerate baselines (desktop + chromium device projects)
        id: regenerate
        # One failing test must not cost the PNGs every other test wrote. The
        # steps below still collect, upload and PR them, and the last step
        # turns the job red again (#1506). The timeout turns a hang into a
        # failure while there's still job time left to do that.
        continue-on-error: true
        timeout-minutes: 100
        run: pnpm playwright test tests/e2e/gui-visual-desktop.spec.ts tests/e2e/gui-visual-tools.spec.ts tests/e2e/device-visual.spec.ts --project=chromium-visual --project=mobile-chromium --project=tablet-chromium "--update-snapshots=$UPDATE_SNAPSHOTS"
        env:
          PW_WORKERS: "2"
      - name: Collect regenerated baselines
        id: collect
        if: always()
        run: bash scripts/visual-baselines-pr.sh collect "$RUNNER_TEMP/visual-baselines" "$RUNNER_TEMP/changed-baselines"
      # Uploaded before any push, so a refused push still leaves every PNG
      # downloadable from the run (#1506).
      - name: Upload regenerated baselines
        id: upload
        if: always() && steps.collect.outcome == 'success' && steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/visual-baselines/
          if-no-files-found: error
      # If collecting failed, keep the whole screenshot tree instead.
      - name: Upload every screenshot (collect failed)
        if: always() && steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-all
          path: tests/e2e/__screenshots__/
      - name: Open PR with refreshed baselines
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/visual-baselines-${{ matrix.os-label }}-${{ github.run_id }}-${{ github.run_attempt }}
          BASE_BRANCH: main
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          REGENERATE_OUTCOME: ${{ steps.regenerate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/visual-baselines-pr.sh push "$RUNNER_TEMP/changed-baselines"
      - name: Fail when regeneration failed
        if: steps.regenerate.outcome == 'failure'
        run: |
          echo "::error::The regenerate step failed. Whatever it rendered was still uploaded and, if the push worked, opened as a draft PR."
          exit 1
