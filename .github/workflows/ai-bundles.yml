name: AI Bundles

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release_commit:
        type: string
        required: true
      verify_model_bundles:
        description: Run every published model bundle against the unpublished release image
        type: boolean
        required: false
    secrets:
      GHCR_TOKEN:
        required: true
      HF_TOKEN:
        required: true
      OCR_RUNTIME_INDEX_SIGNING_KEY_B64:
        required: true
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional successful Release workflow run containing the scanned amd64 digest
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ai-bundles-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate-inputs:
    name: Validate release inputs
    timeout-minutes: 10
    if: inputs.release_commit != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject unsafe or non-semantic versions
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || {
            echo "::error::Bundle version must be a path-safe semantic version"
            exit 1
          }
          [[ ${#VERSION} -le 64 ]] || {
            echo "::error::Bundle version is too long"
            exit 1
          }
          [[ "${RELEASE_COMMIT}" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Release commit must be a full immutable Git commit"
            exit 1
          }

      - name: Validate OCR runtime trust configuration
        env:
          OCR_RUNTIME_INDEX_KEY_ID: ${{ vars.OCR_RUNTIME_INDEX_KEY_ID }}
          OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64: ${{ vars.OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64 }}
        run: |
          : "${OCR_RUNTIME_INDEX_KEY_ID:?Set repository variable OCR_RUNTIME_INDEX_KEY_ID}"
          : "${OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64:?Set repository variable OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64}"
          [[ "${OCR_RUNTIME_INDEX_KEY_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "::error::OCR runtime signing key ID is not a safe identifier"
            exit 1
          }
          umask 077
          trap 'rm -f /tmp/ocr-runtime-public.pem' EXIT
          printf '%s' "${OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64}" \
            | base64 --decode > /tmp/ocr-runtime-public.pem
          [[ "$(base64 --wrap=0 < /tmp/ocr-runtime-public.pem)" == "${OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64}" ]] || {
            echo "::error::OCR runtime public key must use canonical base64"
            exit 1
          }
          openssl pkey -pubin -in /tmp/ocr-runtime-public.pem -text -noout \
            | grep -q ED25519 || {
              echo "::error::Configured OCR runtime public key is not Ed25519"
              exit 1
            }

  preflight-gpu-runner:
    # The NVIDIA verification below is the only job that needs physical hardware,
    # and it cannot start until build-ocr has produced an image digest. That used
    # to mean an offline GPU box burned a full multi-arch build and then parked in
    # "Queued" for 24h at sign-ocr-index, with nothing in the run explaining why.
    #
    # This job claims the same labels with no dependencies, so it is the first
    # thing scheduled. If the box is offline the run visibly sits here at second
    # zero instead of failing much later and much less legibly. It also proves the
    # GPU is usable BEFORE the expensive build, rather than after it.
    #
    # Note: this cannot be an API check. Listing self-hosted runners needs
    # Administration:read, which is not an available GITHUB_TOKEN permission, so
    # an API preflight would 403 on every run and pass vacuously. Claiming the
    # label is the only signal available to the workflow itself. RELEASE.md
    # carries the maintainer-side `gh api` check to run before dispatching.
    name: Preflight GPU runner
    needs: validate-inputs
    timeout-minutes: 10
    runs-on: [self-hosted, linux, x64, snapotter-nvidia]
    permissions: {}
    steps:
      - name: Require a working NVIDIA container runtime
        run: |
          command -v nvidia-smi >/dev/null || {
            echo "::error::nvidia-smi is missing on the snapotter-nvidia runner"
            exit 1
          }
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          docker info --format '{{json .Runtimes}}' | grep -q 'nvidia' || {
            echo "::error::Docker on the snapotter-nvidia runner has no nvidia runtime"
            exit 1
          }

      - name: Require enough free disk for the release image and bundles
        run: |
          free_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "free on /: ${free_gb}G"
          [[ "${free_gb}" -ge 25 ]] || {
            echo "::error::Need at least 25G free on the runner, found ${free_gb}G"
            exit 1
          }

  audit-ocr-release-locks:
    name: Audit OCR runtime release locks
    # build-ocr logs in to GHCR and builds the runtime that gets signed and
    # shipped, so the lock audit can't run there: pip-audit and its
    # dependencies are not hash-locked, and on that runner they could write
    # $GITHUB_ENV or $GITHUB_PATH ahead of the GHCR_TOKEN and build steps
    # (#1950). Jobs get fresh runners, so this one has no secrets and runs
    # alongside preflight-gpu-runner. --strict fails the audit on any entry it
    # cannot check (a URL pin, a package PyPI no longer lists) instead of
    # skipping it.
    timeout-minutes: 10
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the OCR runtime locks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Set up pinned release Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.14"

      - name: Audit exact OCR runtime dependency locks
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.0"
          pip-audit -r docker/ocr-runtime-requirements-amd64.txt --no-deps --disable-pip --aliases --strict
          pip-audit -r docker/ocr-runtime-requirements-arm64.txt --no-deps --disable-pip --aliases --strict

  build-ocr:
    name: Build OCR (${{ matrix.target }})
    # Gated on preflight-gpu-runner: nothing here can be signed or published
    # without the NVIDIA verification, so spending 90 minutes building before
    # confirming that box is up only makes the failure slower and less obvious.
    needs: [validate-inputs, preflight-gpu-runner, audit-ocr-release-locks]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-cpu-py312
            image_platform: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64-cpu-py311
            image_platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag binding
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" \
            && "${tag_commit}" == "${RELEASE_COMMIT}" ]] || {
              echo "::error::Release tag no longer resolves to the selected commit"
              exit 1
            }

      - name: Download unpublished image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.image_platform }}
          path: /tmp/image-digest

      - name: Resolve exact build image
        env:
          IMAGE_PLATFORM: ${{ matrix.image_platform }}
        run: |
          mapfile -t digest_files < <(find /tmp/image-digest -maxdepth 1 -type f -print)
          [[ ${#digest_files[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one ${IMAGE_PLATFORM} image digest"
            exit 1
          }
          digest="$(basename "${digest_files[0]}")"
          [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid image digest artifact"
            exit 1
          }
          echo "SNAPOTTER_BUNDLE_IMAGE=ghcr.io/snapotter-hq/snapotter@sha256:${digest}" >> "$GITHUB_ENV"
          echo "SNAPOTTER_BUNDLE_IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build immutable OCR runtime in its native app image
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: scripts/ai-bundles/build-ocr-in-app-image.sh

      - name: Upload OCR build artifact for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-${{ matrix.target }}
          overwrite: true
          path: |
            /tmp/bundles/primary/ocr-${{ matrix.target }}.tar.gz
            /tmp/bundles/primary/ocr-${{ matrix.target }}.tar.gz.sha256
            /tmp/bundles/primary/ocr-${{ matrix.target }}.artifact.json
          if-no-files-found: error
          retention-days: 1

  verify-ocr:
    name: Verify OCR (${{ matrix.target }})
    needs: build-ocr
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-cpu-py312
            image_platform: linux-amd64
            runner: ubuntu-latest
            gpu_visible: none
            cuda_visible: ""
          - target: linux-arm64-cpu-py311
            image_platform: linux-arm64
            runner: ubuntu-24.04-arm
            gpu_visible: none
            cuda_visible: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag binding
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" \
            && "${tag_commit}" == "${RELEASE_COMMIT}" ]] || {
              echo "::error::Release tag no longer resolves to the selected commit"
              exit 1
            }

      - name: Download unpublished image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.image_platform }}
          path: /tmp/image-digest

      - name: Resolve exact verification image
        env:
          IMAGE_PLATFORM: ${{ matrix.image_platform }}
        run: |
          mapfile -t digest_files < <(find /tmp/image-digest -maxdepth 1 -type f -print)
          [[ ${#digest_files[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one ${IMAGE_PLATFORM} image digest"
            exit 1
          }
          digest="$(basename "${digest_files[0]}")"
          [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid image digest artifact"
            exit 1
          }
          echo "SNAPOTTER_BUNDLE_IMAGE=ghcr.io/snapotter-hq/snapotter@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Verify image has the release trust identity
        env:
          OCR_RUNTIME_INDEX_KEY_ID: ${{ vars.OCR_RUNTIME_INDEX_KEY_ID }}
          OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64: ${{ vars.OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64 }}
        run: |
          : "${OCR_RUNTIME_INDEX_KEY_ID:?Set repository variable OCR_RUNTIME_INDEX_KEY_ID}"
          : "${OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64:?Set repository variable OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64}"
          # The official image bakes the trust store as a FILE
          # (/app/docker/ocr-runtime-trust.json, written by write-ocr-runtime-trust.mjs)
          # and deliberately leaves OCR_RUNTIME_INDEX_* unset in the image env: those
          # are the operator-override path, and loadOcrRuntimeTrustKeys
          # (packages/ai/src/runtime-index.ts:52-71) reads env only when set, else the
          # baked file. So verify the file the runtime actually trusts, not the env.
          trust_json="$(docker run --rm --entrypoint sh "${SNAPOTTER_BUNDLE_IMAGE}" \
            -c 'cat /app/docker/ocr-runtime-trust.json')"
          actual_key_id="$(printf '%s' "${trust_json}" | jq -r '.keys[0].keyId')"
          actual_public_key="$(printf '%s' "${trust_json}" | jq -r '.keys[0].publicKey')"
          expected_public_key="$(printf '%s' "${OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64}" | base64 --decode)"
          actual_official_container="$(docker run --rm --entrypoint sh "${SNAPOTTER_BUNDLE_IMAGE}" \
            -c 'printf %s "$SNAPOTTER_OFFICIAL_CONTAINER"')"
          [[ "${actual_key_id}" == "${OCR_RUNTIME_INDEX_KEY_ID}" ]] || {
            echo "::error::Baked OCR trust key ID (${actual_key_id}) does not match the release identity"
            exit 1
          }
          [[ "${actual_public_key}" == "${expected_public_key}" ]] || {
            echo "::error::Baked OCR trust public key does not match the release identity"
            exit 1
          }
          [[ "${actual_official_container}" == "1" ]] || {
            echo "::error::Verification image is not marked as an official container"
            exit 1
          }

      - name: Download OCR build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-${{ matrix.target }}
          path: /tmp/bundles

      - name: Verify exact Fast OCR payload
        run: |
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          docker run --rm --network none \
            -e EMBEDDED=0 \
            -e PUID="${RUNNER_UID}" \
            -e PGID="${RUNNER_GID}" \
            "${SNAPOTTER_BUNDLE_IMAGE}" \
            bash -ceu '
              expected=(chi_sim deu eng fra jpn spa)
              mapfile -t actual < <(tesseract --list-langs 2>/dev/null | tail -n +2 | LC_ALL=C sort)
              [[ "${actual[*]}" == "${expected[*]}" ]] || {
                echo "FAIL: Fast OCR language payload changed: ${actual[*]}" >&2
                exit 1
              }
              tessdata=/usr/share/tesseract-ocr/5/tessdata
              [[ ! -e "${tessdata}/osd.traineddata" && ! -e "${tessdata}/kor.traineddata" ]] || {
                echo "FAIL: Fast OCR unexpectedly contains orientation or Korean traineddata" >&2
                exit 1
              }
              traineddata_bytes="$(find "${tessdata}" -maxdepth 1 -type f -name "*.traineddata" -printf "%s\n" \
                | awk "{ total += \$1 } END { print total + 0 }")"
              [[ "${traineddata_bytes}" == "14003738" ]] || {
                echo "FAIL: Fast OCR traineddata size changed: ${traineddata_bytes}" >&2
                exit 1
              }
              echo "PASS: exact Fast OCR languages and 14003738 traineddata bytes; about 25 MiB remains a measured approximate image-layer size"
            '

      - name: Verify offline install and runtime smoke
        env:
          CUDA_VISIBLE_DEVICES: ${{ matrix.cuda_visible }}
          NVIDIA_VISIBLE_DEVICES: ${{ matrix.gpu_visible }}
          TARGET: ${{ matrix.target }}
        run: scripts/ai-bundles/verify-ocr-offline-install.sh

      - name: Upload native OCR quality and resource report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-quality-${{ matrix.target }}
          overwrite: true
          path: /tmp/ocr-quality/*.quality.json
          if-no-files-found: error
          retention-days: 30

      - name: Extract verified OCR runtime for supply-chain inspection
        id: extract_runtime
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ai-bundles/extract-ocr-runtime-for-inspection.sh

      - name: Install pinned Syft 1.42.3 from verified release bytes
        env:
          SYFT_VERSION: "1.42.3"
        run: scripts/ai-bundles/install-pinned-syft.sh

      - name: Generate per-target OCR runtime SBOMs
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          syft scan "dir:/tmp/ocr-runtime-scan" \
            --source-name "snapotter-ocr-${TARGET}" \
            --source-version "${VERSION}" \
            -o "cyclonedx-json=/tmp/ocr-security/ocr-${TARGET}-sbom.cdx.json" \
            -o "spdx-json=/tmp/ocr-security/ocr-${TARGET}-sbom.spdx.json"

      - name: Gate OCR runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: sbom
          scan-ref: /tmp/ocr-security/ocr-${{ matrix.target }}-sbom.cdx.json
          scanners: vuln
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"
          timeout: 10m0s

      - name: Record per-target OCR runtime vulnerability report
        if: always() && steps.extract_runtime.outputs.ready == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: sbom
          scan-ref: /tmp/ocr-security/ocr-${{ matrix.target }}-sbom.cdx.json
          scanners: vuln
          format: json
          output: /tmp/ocr-security/ocr-${{ matrix.target }}-trivy.json
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"
          timeout: 10m0s

      - name: Upload per-target OCR security reports
        if: always() && steps.extract_runtime.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-security-${{ matrix.target }}
          overwrite: true
          path: |
            /tmp/ocr-security/ocr-${{ matrix.target }}-sbom.cdx.json
            /tmp/ocr-security/ocr-${{ matrix.target }}-sbom.spdx.json
            /tmp/ocr-security/ocr-${{ matrix.target }}-trivy.json
          if-no-files-found: error
          retention-days: 30

  verify-ocr-nvidia:
    name: Verify amd64 CPU OCR with a real NVIDIA GPU exposed
    needs: build-ocr
    timeout-minutes: 60
    runs-on: [self-hosted, linux, x64, snapotter-nvidia]
    env:
      DOCKER_CONFIG: /tmp/snapotter-ocr-docker-config
    permissions:
      contents: read
      packages: read
    steps:
      - name: Clear persistent runner release state
        run: |
          rm -rf /tmp/image-digest /tmp/bundles /tmp/ocr-quality /tmp/snapotter-ocr-docker-config
          mkdir -p /tmp/image-digest /tmp/bundles /tmp/ocr-quality /tmp/snapotter-ocr-docker-config

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag binding
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" \
            && "${tag_commit}" == "${RELEASE_COMMIT}" ]] || {
              echo "::error::Release tag no longer resolves to the selected commit"
              exit 1
            }

      - name: Require a working NVIDIA container runtime
        run: |
          command -v nvidia-smi >/dev/null
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          docker info --format '{{json .Runtimes}}' | grep -q 'nvidia'

      - name: Download unpublished amd64 image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-amd64
          path: /tmp/image-digest

      - name: Resolve exact amd64 verification image
        run: |
          mapfile -t digest_files < <(find /tmp/image-digest -maxdepth 1 -type f -print)
          [[ ${#digest_files[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one linux-amd64 image digest"
            exit 1
          }
          digest="$(basename "${digest_files[0]}")"
          [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid amd64 image digest artifact"
            exit 1
          }
          echo "SNAPOTTER_BUNDLE_IMAGE=ghcr.io/snapotter-hq/snapotter@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Download amd64 OCR build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-linux-amd64-cpu-py312
          path: /tmp/bundles

      - name: Prove the GPU is exposed inside the release image
        run: |
          docker run --rm --gpus all --entrypoint sh "${SNAPOTTER_BUNDLE_IMAGE}" \
            -c 'test -e /dev/nvidiactl && test -r /proc/driver/nvidia/version'

      - name: Verify the portable CPU runtime with NVIDIA exposed
        run: |
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          rm -rf /tmp/ocr-quality
          install -d -m 1777 /tmp/ocr-quality
          docker run --rm --gpus all --network none --memory 4g --memory-swap 4g \
            -v "$PWD/docker/verify-ocr-runtime.sh:/verify-ocr-runtime.sh:ro" \
            -v "$PWD/packages/ai/python/install_runtime.py:/app/packages/ai/python/install_runtime.py:ro" \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -v "/tmp/bundles:/bundles:ro" \
            -v "/tmp/ocr-quality:/reports" \
            -e EMBEDDED=0 \
            -e PUID="${RUNNER_UID}" \
            -e PGID="${RUNNER_GID}" \
            -e CUDA_VISIBLE_DEVICES=0 \
            -e NVIDIA_VISIBLE_DEVICES=all \
            -e OCR_VERIFY_ENVIRONMENT=nvidia-exposed-cpu \
            -e OCR_VERIFY_REPORT_DIR=/reports \
            "${SNAPOTTER_BUNDLE_IMAGE}" \
            /verify-ocr-runtime.sh linux-amd64-cpu-py312 full
          chmod 0755 /tmp/ocr-quality
          test -r /tmp/ocr-quality/ocr-linux-amd64-cpu-py312-nvidia-exposed-cpu.quality.json

      - name: Upload NVIDIA-exposed CPU OCR quality and resource report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-quality-linux-amd64-cpu-py312-nvidia
          overwrite: true
          path: /tmp/ocr-quality/*.quality.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove release-scoped state from persistent runner
        if: always()
        run: |
          if [[ -n "${SNAPOTTER_BUNDLE_IMAGE:-}" ]]; then
            docker image rm "${SNAPOTTER_BUNDLE_IMAGE}" || true
          fi
          rm -rf /tmp/image-digest /tmp/bundles /tmp/ocr-quality /tmp/snapotter-ocr-docker-config

  sign-ocr-index:
    name: Sign verified OCR runtime index
    timeout-minutes: 20
    needs: [build-ocr, verify-ocr, verify-ocr-nvidia]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag for provenance verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind signing to the checked-out release tag commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" \
            && "${tag_commit}" == "${RELEASE_COMMIT}" ]] || {
            echo "::error::Checked-out commit does not match release tag v${VERSION}"
            exit 1
          }
          [[ "${WORKFLOW_COMMIT}" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Reusable workflow revision is not an immutable commit"
            exit 1
          }
          echo "SNAPOTTER_RELEASE_COMMIT=${RELEASE_COMMIT}" >> "$GITHUB_ENV"
          echo "SNAPOTTER_WORKFLOW_COMMIT=${WORKFLOW_COMMIT}" >> "$GITHUB_ENV"

      - name: Download exact amd64 release image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-amd64
          path: /tmp/image-digests/linux-amd64

      - name: Download exact arm64 release image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-arm64
          path: /tmp/image-digests/linux-arm64

      # Exact artifact names, never a pattern (#1950). Every job in the run
      # can upload an artifact, including the audit jobs running unhashed
      # pip-audit, and a pattern with merge-multiple would let a planted
      # artifact overwrite a real report before this job signs its hash.
      - name: Download verified artifact ocr-linux-amd64-cpu-py312
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-linux-amd64-cpu-py312
          path: /tmp/ocr-artifacts

      - name: Download verified artifact ocr-linux-arm64-cpu-py311
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-linux-arm64-cpu-py311
          path: /tmp/ocr-artifacts

      - name: Download verified artifact ocr-security-linux-amd64-cpu-py312
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-security-linux-amd64-cpu-py312
          path: /tmp/ocr-attestations

      - name: Download verified artifact ocr-security-linux-arm64-cpu-py311
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-security-linux-arm64-cpu-py311
          path: /tmp/ocr-attestations

      - name: Download verified artifact ocr-quality-linux-amd64-cpu-py312
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-quality-linux-amd64-cpu-py312
          path: /tmp/ocr-attestations

      - name: Download verified artifact ocr-quality-linux-arm64-cpu-py311
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-quality-linux-arm64-cpu-py311
          path: /tmp/ocr-attestations

      - name: Download verified artifact ocr-quality-linux-amd64-cpu-py312-nvidia
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-quality-linux-amd64-cpu-py312-nvidia
          path: /tmp/ocr-attestations

      - name: Create canonical unsigned index and validate its archives
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/ai-bundles/create-unsigned-ocr-index.sh

      - name: Sign with repository-trusted Ed25519 identity
        env:
          OCR_RUNTIME_INDEX_KEY_ID: ${{ vars.OCR_RUNTIME_INDEX_KEY_ID }}
          OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64: ${{ vars.OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64 }}
          OCR_RUNTIME_INDEX_SIGNING_KEY_B64: ${{ secrets.OCR_RUNTIME_INDEX_SIGNING_KEY_B64 }}
        run: scripts/ai-bundles/sign-ocr-index.sh

      - name: Seal canonical index and public trust artifact
        env:
          OCR_RUNTIME_INDEX_KEY_ID: ${{ vars.OCR_RUNTIME_INDEX_KEY_ID }}
        run: scripts/ai-bundles/seal-ocr-index.sh

      - name: Upload verified signed OCR metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-runtime-metadata
          overwrite: true
          path: |
            /tmp/ocr-index/ocr-runtime-index.json
            /tmp/ocr-index/ocr-runtime-trusted-keys.json
          if-no-files-found: error
          retention-days: 1

  verify-signed-ocr-index:
    name: Verify signed OCR index (${{ matrix.target }})
    needs: sign-ocr-index
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-cpu-py312
            image_platform: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64-cpu-py311
            image_platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    steps:
      - name: Download final signed OCR index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-runtime-metadata
          path: /tmp/ocr-index

      - name: Download exact unpublished image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.image_platform }}
          path: /tmp/image-digest

      - name: Resolve exact native image
        env:
          IMAGE_PLATFORM: ${{ matrix.image_platform }}
        run: |
          mapfile -t digest_files < <(find /tmp/image-digest -maxdepth 1 -type f -print)
          [[ ${#digest_files[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one ${IMAGE_PLATFORM} image digest"
            exit 1
          }
          digest="$(basename "${digest_files[0]}")"
          [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid ${IMAGE_PLATFORM} image digest artifact"
            exit 1
          }
          echo "SNAPOTTER_BUNDLE_IMAGE=ghcr.io/snapotter-hq/snapotter@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Verify final index with image-baked application trust
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --network none \
            -v /tmp/ocr-index/ocr-runtime-index.json:/tmp/ocr-runtime-index.json:ro \
            -e EMBEDDED=0 \
            -e OCR_VERIFY_TARGET="${TARGET}" \
            -e OCR_VERIFY_VERSION="${VERSION}" \
            "${SNAPOTTER_BUNDLE_IMAGE}" \
            /app/apps/api/node_modules/.bin/tsx -e '
              import { readFileSync } from "node:fs";
              import {
                loadOcrRuntimeTrustKeys,
                OCR_RUNTIME_INDEX_MAX_BYTES,
                verifyRuntimeIndex,
              } from "/app/packages/ai/src/runtime-index.ts";
              const target = process.env.OCR_VERIFY_TARGET;
              const version = process.env.OCR_VERIFY_VERSION;
              if (!target || !version) throw new Error("Signed-index verification environment is incomplete");
              const raw = readFileSync("/tmp/ocr-runtime-index.json");
              if (raw.length > OCR_RUNTIME_INDEX_MAX_BYTES) {
                throw new Error(`Final OCR runtime index exceeds ${OCR_RUNTIME_INDEX_MAX_BYTES} bytes`);
              }
              const parsed = JSON.parse(raw.toString("ascii"));
              const targets = parsed.artifacts
                ?.map((artifact) => artifact?.target)
                .sort();
              const expectedTargets = [
                "linux-amd64-cpu-py312",
                "linux-arm64-cpu-py311",
              ];
              if (JSON.stringify(targets) !== JSON.stringify(expectedTargets)) {
                throw new Error(`Final OCR runtime index target set is invalid: ${JSON.stringify(targets)}`);
              }
              const trustKeys = loadOcrRuntimeTrustKeys();
              const verified = verifyRuntimeIndex(raw, target, trustKeys, version);
              if (verified.artifact.target !== target || verified.artifact.version !== version) {
                throw new Error("Final OCR runtime index selected the wrong target or version");
              }
              process.stdout.write(`PASS: image-baked trust verified ${target} for ${version}\n`);
            '

  audit-hf-release-lock:
    name: Audit hf CLI release lock
    # CI's required audit only runs when a PR does, so an advisory published
    # against an unchanged docker/hf-release-requirements.txt would otherwise
    # reach a release that installs it in the job holding the HuggingFace write
    # token (#1838). This is its own job, with no secrets, because pip-audit and
    # its dependencies are not hash-locked: on the publish runner they could
    # write $GITHUB_ENV, $GITHUB_PATH or the lock itself ahead of the token
    # steps. --strict fails the audit on any entry it cannot check (a URL pin,
    # a package PyPI no longer lists) instead of skipping it.
    timeout-minutes: 10
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Set up pinned release Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.14"

      - name: Audit hash-locked hf CLI lock
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.0"
          pip-audit -r docker/hf-release-requirements.txt --no-deps --disable-pip --aliases --strict

  publish:
    name: Publish verified bundles to HuggingFace
    # Uploads the full v3 set to HuggingFace and then re-downloads and hashes
    # every published object. Untimed, a stalled transfer burns the 360 minute
    # default before anyone notices.
    timeout-minutes: 60
    needs: [verify-ocr, sign-ocr-index, verify-signed-ocr-index, audit-hf-release-lock]
    # Hugging Face exposes one repository-wide branch head. Keep expensive
    # builds parallel across releases, then serialize only the short CAS write
    # boundary so two versions cannot race the shared `main` revision.
    concurrency:
      group: snapotter-hf-feature-bundles-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out hash-locked release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag binding
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" \
            && "${tag_commit}" == "${RELEASE_COMMIT}" ]] || {
              echo "::error::Release tag no longer resolves to the selected commit"
              exit 1
            }

      - name: Set up pinned release Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.14"

      # One exact artifact per step, never the whole run (#1950). Every job in
      # the run holds ACTIONS_RUNTIME_TOKEN and can upload an artifact, and the
      # audit jobs run unhashed pip-audit, so an unscoped download would pull in
      # anything they planted. The closure check below would ignore or reject
      # it; naming each artifact keeps it from reaching this runner at all.
      - name: Download verified artifact ocr-linux-amd64-cpu-py312
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-linux-amd64-cpu-py312
          path: /tmp/artifacts/ocr-linux-amd64-cpu-py312

      - name: Download verified artifact ocr-linux-arm64-cpu-py311
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-linux-arm64-cpu-py311
          path: /tmp/artifacts/ocr-linux-arm64-cpu-py311

      - name: Download verified artifact ocr-security-linux-amd64-cpu-py312
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-security-linux-amd64-cpu-py312
          path: /tmp/artifacts/ocr-security-linux-amd64-cpu-py312

      - name: Download verified artifact ocr-security-linux-arm64-cpu-py311
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-security-linux-arm64-cpu-py311
          path: /tmp/artifacts/ocr-security-linux-arm64-cpu-py311

      - name: Download verified artifact ocr-quality-linux-amd64-cpu-py312
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-quality-linux-amd64-cpu-py312
          path: /tmp/artifacts/ocr-quality-linux-amd64-cpu-py312

      - name: Download verified artifact ocr-quality-linux-arm64-cpu-py311
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-quality-linux-arm64-cpu-py311
          path: /tmp/artifacts/ocr-quality-linux-arm64-cpu-py311

      - name: Download verified artifact ocr-quality-linux-amd64-cpu-py312-nvidia
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-quality-linux-amd64-cpu-py312-nvidia
          path: /tmp/artifacts/ocr-quality-linux-amd64-cpu-py312-nvidia

      - name: Download verified artifact ocr-runtime-metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-runtime-metadata
          path: /tmp/artifacts/ocr-runtime-metadata

      - name: Install hash-locked hf CLI
        run: |
          python -m venv /tmp/hf-release-venv
          /tmp/hf-release-venv/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: \
            --requirement docker/hf-release-requirements.txt
          echo "/tmp/hf-release-venv/bin" >> "$GITHUB_PATH"

      - name: Organize and verify the exact signed OCR release closure
        env:
          OCR_RUNTIME_INDEX_KEY_ID: ${{ vars.OCR_RUNTIME_INDEX_KEY_ID }}
          OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64: ${{ vars.OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64 }}
          VERSION: ${{ inputs.version }}
        run: scripts/ai-bundles/organize-ocr-release-closure.sh

      - name: Refuse to mutate an existing version
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OCR_RUNTIME_INDEX_KEY_ID: ${{ vars.OCR_RUNTIME_INDEX_KEY_ID }}
          OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64: ${{ vars.OCR_RUNTIME_INDEX_PUBLIC_KEY_PEM_B64 }}
          VERSION: ${{ inputs.version }}
        run: scripts/ai-bundles/refuse-existing-version.sh

      - name: Upload only after every verification and signing gate passed
        if: env.BUNDLE_RELEASE_EXISTS != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: scripts/ai-bundles/upload-verified-bundles.sh

      - name: Report identical existing bundle release
        if: env.BUNDLE_RELEASE_EXISTS == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Verified immutable existing bundle release v${VERSION}; upload skipped"

  verify-model-bundles:
    name: Verify model bundles (${{ matrix.arch }})
    # Opt-in: release.yml does not pass verify_model_bundles yet, and publish does
    # not depend on this job, so it cannot affect a release until the owner wires it.
    needs: [validate-inputs, build-ocr]
    if: inputs.verify_model_bundles
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64-gpu
            image_platform: linux-amd64
            runner: ubuntu-latest
          - arch: arm64-cpu
            image_platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag binding
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" \
            && "${tag_commit}" == "${RELEASE_COMMIT}" ]] || {
              echo "::error::Release tag no longer resolves to the selected commit"
              exit 1
            }

      - name: Download unpublished image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.image_platform }}
          path: /tmp/image-digest

      - name: Resolve exact release image
        env:
          IMAGE_PLATFORM: ${{ matrix.image_platform }}
        run: |
          mapfile -t digest_files < <(find /tmp/image-digest -maxdepth 1 -type f -print)
          [[ ${#digest_files[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one ${IMAGE_PLATFORM} image digest"
            exit 1
          }
          digest="$(basename "${digest_files[0]}")"
          [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid image digest artifact"
            exit 1
          }
          echo "SNAPOTTER_BUNDLE_IMAGE=ghcr.io/snapotter-hq/snapotter@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Install every published model bundle into the exact unpublished release
      # image and run its tool against a fixture, asserting the real output oracle
      # (not a hardcoded import list). One bundle at a time so a runner's disk holds
      # only a single multi-GB archive. Offline (`--network none`) so a bundle can
      # never mask a missing dependency with a runtime download. The OCR bundle is
      # excluded -- it has its own signed v3 runtime pipeline above.
      - name: Run each published model bundle against the release image
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/ai-bundles/run-published-model-bundles.sh

  installed-ai-production:
    name: Verify installed AI in production image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Resolve a successful scanned release run
        id: source
        if: inputs.release_commit == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "${SOURCE_RUN_ID}" ]]; then
            [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::source_run_id must be a positive workflow run ID"
              exit 1
            }
            candidate_run_ids=("${SOURCE_RUN_ID}")
          else
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?status=completed&per_page=50" \
              > "${RUNNER_TEMP}/release-runs.json"
            mapfile -t candidate_run_ids < <(
              jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' \
                "${RUNNER_TEMP}/release-runs.json"
            )
          fi

          selected_run=""
          for candidate_run_id in "${candidate_run_ids[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}" \
              > "${RUNNER_TEMP}/candidate-run.json"
            if ! jq -e \
              '.path == ".github/workflows/release.yml"
                and .status == "completed"
                and .conclusion == "success"' \
              "${RUNNER_TEMP}/candidate-run.json" >/dev/null; then
              if [[ -n "${SOURCE_RUN_ID}" ]]; then
                echo "::error::Selected run is not a completed successful Release workflow"
                exit 1
              fi
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts?per_page=100" \
              > "${RUNNER_TEMP}/candidate-artifacts.json"
            artifact_count="$(
              jq '[.artifacts[] | select(.name == "digests-linux-amd64" and .expired == false)] | length' \
                "${RUNNER_TEMP}/candidate-artifacts.json"
            )"
            if [[ "${artifact_count}" != "1" ]]; then
              if [[ -n "${SOURCE_RUN_ID}" ]]; then
                echo "::error::Selected release run does not have one live amd64 digest artifact"
                exit 1
              fi
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?per_page=100" \
              > "${RUNNER_TEMP}/candidate-jobs.json"
            if ! jq -e \
              '([.jobs[] | select(.name == "Trivy Container Scan (linux-amd64)")] | length) == 1
                and ([.jobs[] | select(.name == "Trivy Container Scan (linux-amd64)")][0].conclusion == "success")' \
              "${RUNNER_TEMP}/candidate-jobs.json" >/dev/null; then
              if [[ -n "${SOURCE_RUN_ID}" ]]; then
                echo "::error::Selected release run has no successful amd64 container scan"
                exit 1
              fi
              continue
            fi

            selected_run="${candidate_run_id}"
            break
          done
          [[ -n "${selected_run}" ]] || {
            echo "::error::No successful Release run has a live, scanned amd64 digest artifact"
            exit 1
          }
          echo "run_id=${selected_run}" >> "${GITHUB_OUTPUT}"

      - name: Download current release amd64 digest
        if: inputs.release_commit != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/installed-ai-digest

      - name: Download historical release amd64 digest
        if: inputs.release_commit == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/installed-ai-digest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Resolve the exact image digest
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(
            find "${RUNNER_TEMP}/installed-ai-digest" -mindepth 1 -maxdepth 1 -type f -print
          )
          [[ ${#digest_files[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one amd64 image digest"
            exit 1
          }
          IMAGE_DIGEST="$(basename "${digest_files[0]}")"
          [[ "${IMAGE_DIGEST}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::amd64 image artifact contains an invalid digest"
            exit 1
          }
          [[ ! -s "${digest_files[0]}" ]] || {
            echo "::error::amd64 digest marker unexpectedly contains mutable payload data"
            exit 1
          }
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_ENV}"

      - name: Reclaim unused hosted-runner SDK space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL

      - name: Require enough free disk for the image and installed bundles
        run: |
          set -euo pipefail
          docker_root_dir="$(docker info --format '{{.DockerRootDir}}')"
          [[ "${docker_root_dir}" == /* ]] || {
            echo "::error::Docker reported an invalid storage root"
            exit 1
          }
          available_kib="$(sudo df -Pk "${docker_root_dir}" | awk 'NR == 2 { print $4 }')"
          [[ "${available_kib}" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not measure runner disk availability"
            exit 1
          }
          # background-removal's 4.8 GB archive reserves roughly 18.4 GiB in
          # /data by itself; keep room for the image, venv, and transcription.
          minimum_kib=$((30 * 1024 * 1024))
          (( available_kib >= minimum_kib )) || {
            echo "::error::Installed-AI verification requires 30 GiB free; runner has $((available_kib / 1024 / 1024)) GiB"
            exit 1
          }
          sudo df -h "${docker_root_dir}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull and validate the exact amd64 release image
        id: image
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          image="ghcr.io/snapotter-hq/snapotter@sha256:${IMAGE_DIGEST}"
          docker pull "${image}"
          architecture="$(docker image inspect --format '{{.Architecture}}' "${image}")"
          source_repository="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
              "${image}"
          )"
          source_commit="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${image}"
          )"
          [[ "${architecture}" == "amd64" ]] || {
            echo "::error::Digest resolved to ${architecture}, not amd64"
            exit 1
          }
          [[ "${source_repository}" == "https://github.com/${GITHUB_REPOSITORY}" ]] || {
            echo "::error::Release image source label does not match this repository"
            exit 1
          }
          [[ "${source_commit}" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Release image has no immutable source revision"
            exit 1
          }
          if [[ -n "${RELEASE_COMMIT}" && "${source_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Release image revision differs from the requested release commit"
            exit 1
          fi
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the immutable QA harness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable QA harness checkout
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "${WORKFLOW_SHA}" =~ ^[a-f0-9]{40}$ \
            && "$(git rev-parse HEAD)" == "${WORKFLOW_SHA}" ]] || {
              echo "::error::QA harness checkout differs from the workflow revision"
              exit 1
            }

      - uses: ./.github/actions/setup

      - name: Create exact labeled production resources
        run: scripts/ai-bundles/create-installed-ai-resources.sh

      - name: Wait for the production API
        run: |
          set -euo pipefail
          api_ready=false
          for _attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 5 \
              "${QA_BASE_URL}/api/v1/health" \
              | jq -e '.status == "healthy"' >/dev/null; then
              api_ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "${RUN_SCOPE}-app" \
              | grep -qx true; then
              echo "::error::Production app container exited before becoming healthy"
              docker logs "${RUN_SCOPE}-app" || true
              exit 1
            fi
            sleep 3
          done
          [[ "${api_ready}" == "true" ]] || {
            echo "::error::Production API did not become healthy"
            docker logs "${RUN_SCOPE}-app" || true
            exit 1
          }

      - name: Install bundles and verify four public tool artifacts
        env:
          QA_USERNAME: admin
        run: ./apps/api/node_modules/.bin/tsx tests/qa/verify-installed-ai-production.mts

      - name: Show exact production-container diagnostics
        if: ${{ failure() }}
        run: |
          docker logs "${RUN_SCOPE}-app" || true
          docker logs "${RUN_SCOPE}-postgres" || true
          docker logs "${RUN_SCOPE}-redis" || true

      - name: Remove only exact labeled run resources
        if: ${{ always() }}
        run: scripts/ai-bundles/remove-installed-ai-resources.sh
