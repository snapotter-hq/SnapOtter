name: Setup Project
description: Install pnpm, Node.js 22, and dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        # Without this a runner that already has an older 22.x cached uses it, and
        # Astro 7 refuses to build on anything below 22.23.4.
        check-latest: true
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
