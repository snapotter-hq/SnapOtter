# Priority
- name: "priority: critical"
  color: "b60205"
  description: Must be fixed immediately

- name: "priority: high"
  color: "d93f0b"
  description: Important, fix soon

- name: "priority: medium"
  color: "f6a935"
  description: Worth scheduling, not urgent

- name: "priority: low"
  color: "c2e0c6"
  description: Nice to have, no rush

# Roadmap
- name: "roadmap: now"
  color: "0e8a16"
  description: Actively being worked on

- name: "roadmap: next"
  color: "fbca04"
  description: Planned for near term

- name: "roadmap: later"
  color: "c5def5"
  description: On the radar, not yet scheduled

- name: community-request
  color: "d876e3"
  description: Requested by the community

# Meta
- name: released
  color: "ededed"
  description: Shipped in a published release

- name: qa-sweep
  color: "FBCA04"
  description: Found by the master QA sweep

- name: self-driving
  color: "ededed"

- name: duplicate
  color: "cfd3d7"
  description: This issue or PR already exists

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

- name: invalid
  color: "e4e669"
  description: Not a valid issue or doesn't apply
